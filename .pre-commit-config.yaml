# Local checks before each commit, mirroring the CI lint job.
# Setup (once per clone): `pre-commit install` (Fedora: `sudo dnf install pre-commit`)
# Run manually on all files: `pre-commit run --all-files`
repos:
  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.12 # also used by the CI lint job
    hooks:
      - id: actionlint

  - repo: https://github.com/hadolint/hadolint
    rev: v2.15.1
    hooks:
      - id: hadolint-docker

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-yaml
      - id: check-xml
      - id: check-merge-conflict
      - id: end-of-file-fixer
      - id: trailing-whitespace
