name: CI

on:
  # pushes to main run this pipeline through release.yml (workflow_call)
  pull_request:
  # weekly run so new CVEs in dependencies / the base images are detected even without commits
  schedule:
    - cron: '17 4 * * 1'
  workflow_dispatch:
  # the release workflow runs the full pipeline before publishing
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PROMETHEUS_VERSION: v3.14.0
  # Java version of the release build and the container image
  JAVA_VERSION: '21'
  MAVEN_ARGS: --batch-mode --no-transfer-progress --errors

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # single source of truth for the linter version: .pre-commit-config.yaml (updated by Dependabot)
      - name: Read actionlint version from .pre-commit-config.yaml
        id: versions
        run: |
          actionlint=$(awk 'index($0, "repo: https://github.com/rhysd/actionlint") { found = 1; next } found && $1 == "rev:" { print $2; exit }' .pre-commit-config.yaml)
          if [ -z "$actionlint" ]; then
            echo "::error file=.pre-commit-config.yaml::could not read the actionlint version"
            exit 1
          fi
          echo "actionlint=${actionlint#v}" >> "$GITHUB_OUTPUT"

      - name: Lint GitHub Actions workflows
        env:
          ACTIONLINT_VERSION: ${{ steps.versions.outputs.actionlint }}
        run: docker run --rm -v "$PWD:/repo" --workdir /repo "rhysd/actionlint:${ACTIONLINT_VERSION}" -color

      - name: Lint Dockerfile
        if: ${{ !cancelled() }}
        uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          dockerfile: Dockerfile
          failure-threshold: warning

  test:
    name: Test (Java ${{ matrix.java }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 21 = version of the release build and the image, 25 = latest LTS
        java: ['21', '25']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven

      # compiles with -Werror, runs the unit tests and the Spring Boot test against a simulated inverter
      - name: Build and test
        run: mvn verify

      - name: Coverage summary
        run: |
          {
            echo "### Coverage (Java ${{ matrix.java }})"
            python3 .github/scripts/coverage-report.py target/site/jacoco/jacoco.csv | tail -n +3
          } >> "$GITHUB_STEP_SUMMARY"

      # the scrape of the Spring Boot test contains every sunspec_* metric
      - name: Lint exposed metrics (promtool)
        run: |
          # sunspec_* metrics must be clean
          grep -E '^(# (HELP|TYPE) )?sunspec_' target/prometheus-scrape.txt \
            | docker run --rm -i --entrypoint promtool "prom/prometheus:${PROMETHEUS_VERSION}" check metrics
          # Micrometer's own metrics: report only
          docker run --rm -i --entrypoint promtool "prom/prometheus:${PROMETHEUS_VERSION}" check metrics \
            < target/prometheus-scrape.txt || echo "::warning::promtool reported issues with the JVM/HTTP metrics"

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-reports-java-${{ matrix.java }}
          path: target/surefire-reports
          retention-days: 7

      - name: Upload coverage
        if: matrix.java == env.JAVA_VERSION
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage
          path: target/site/jacoco/jacoco.csv
          # runs on main are the baseline for the coverage report of PRs
          retention-days: 90

  coverage:
    name: Coverage report
    needs: test
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # download the coverage of main from the latest release workflow run
      actions: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: coverage
          path: current

      - name: Download coverage of main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run_id=$(gh run list -R "$GITHUB_REPOSITORY" --workflow release.yml --branch main --status success \
            --limit 1 --json databaseId --jq '.[0].databaseId // empty')
          if [ -z "$run_id" ] || ! gh run download "$run_id" -R "$GITHUB_REPOSITORY" -n coverage -D base; then
            echo "::notice::No coverage of main found, the report shows absolute values only"
          fi

      - name: Build report
        run: |
          python3 .github/scripts/coverage-report.py current/jacoco.csv base/jacoco.csv > coverage-report.md
          cat coverage-report.md >> "$GITHUB_STEP_SUMMARY"

      # one comment per PR, updated on every push; not possible for PRs from forks or Dependabot
      # (read-only token), the report is in the job summary then
      - name: Comment on pull request
        if: github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          comment_id=$(gh api "repos/${GITHUB_REPOSITORY}/issues/${PR}/comments" --paginate \
            --jq '.[] | select(.user.login == "github-actions[bot]" and (.body | startswith("<!-- coverage-report -->"))) | .id' | head -n 1)
          if [ -n "$comment_id" ]; then
            gh api --method PATCH "repos/${GITHUB_REPOSITORY}/issues/comments/${comment_id}" -F body=@coverage-report.md > /dev/null
          else
            gh pr comment "$PR" -R "$GITHUB_REPOSITORY" --body-file coverage-report.md
          fi

  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: github/codeql-action/init@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          languages: java-kotlin
          # analyses the sources without a Maven build
          build-mode: none

      - uses: github/codeql-action/analyze@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          # same category on PRs (ci.yml) and on main (release.yml calls ci.yml), so PRs can be compared with main
          category: /language:java-kotlin

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          comment-summary-in-pr: on-failure

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # same platforms as the release; the jar is built once on the runner's platform (no QEMU needed)
      - name: Build multi-arch image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            VERSION=0.0.0-ci

      # amd64 image from cache, loaded for the smoke test and the Trivy scans
      - name: Load amd64 image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          push: false
          load: true
          tags: sunspec-exporter:ci
          cache-from: type=gha
          build-args: |
            VERSION=0.0.0-ci

      - name: Smoke test image
        run: |
          mkdir -p "$RUNNER_TEMP/image-smoke"
          # nothing listens on port 1: the device is reported as down
          printf 'modbus:\n  poll-interval: 1s\n  devices:\n    - host: 127.0.0.1\n      port: 1\n' \
            > "$RUNNER_TEMP/image-smoke/config.yaml"
          docker run -d --name sunspec-exporter -p 8080:8080 \
            -v "$RUNNER_TEMP/image-smoke/config.yaml:/etc/sunspec-exporter/config.yaml:ro" \
            sunspec-exporter:ci
          ok=true
          curl -fsS --retry 30 --retry-delay 1 --retry-all-errors -o /dev/null http://localhost:8080/actuator/health/readiness || ok=false
          sleep 2
          curl -fsS http://localhost:8080/actuator/prometheus | grep -q '^sunspec_up{host="127.0.0.1"} 0.0' || ok=false
          curl -fsS http://localhost:8080/actuator/info | grep -q '"version":"0.0.0-ci"' || ok=false
          docker logs sunspec-exporter
          docker rm -f sunspec-exporter
          [ "$ok" = true ] || { echo "::error::smoke test of the image failed (see log)"; exit 1; }
          # the image must not run as root
          test "$(docker inspect --format '{{.Config.User}}' sunspec-exporter:ci)" = "65532:65532"

      # blocking: known vulnerabilities with a fix in the Java dependencies (the jar in the image)
      - name: Scan Java dependencies with Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: sunspec-exporter:ci
          vuln-type: library
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'

      # reporting only (Security tab): the whole image including the distroless base
      - name: Scan image with Trivy
        if: ${{ !cancelled() }}
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: sunspec-exporter:ci
          format: sarif
          output: trivy.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '0'
          skip-setup-trivy: true

      - name: Upload Trivy results
        if: ${{ !cancelled() && hashFiles('trivy.sarif') != '' }}
        uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          sarif_file: trivy.sarif
          category: trivy
