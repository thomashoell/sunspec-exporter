name: Release

# On every push to main (i.e. every merged PR):
# 1. run the full CI pipeline
# 2. semantic-release (dreitier/shared-ci-components/semantic-release with this repository's .releaserc.json)
#    derives the next version from the Conventional Commits since the last tag, pushes the tag and creates the
#    GitHub release with the release notes (no release commit, no CHANGELOG.md).
#    Nothing happens if there are only non-releasing commits (docs, ci, chore, ...).
#    It runs as the GitHub App thomashoell-release-bot (must be installed on this repository).
# 3. the jar (+ SHA-256) is attached to the release
# 4. the multi-arch image is pushed to GHCR and signed; its CycloneDX SBOM is attached to the release
#    (signing and SBOM: dreitier/shared-ci-components)
# Jar and image get build provenance attestations (verify with `gh attestation verify`).
# 5. thomashoell/helm-charts gets a repository_dispatch "sunspec-exporter-released"; its workflow opens a PR
#    that bumps image.tag of the sunspec-exporter chart (token of the GitHub App thomashoell-release-bot).
on:
  push:
    branches:
      - main
  # re-run a release attempt manually, e.g. after a failed publish
  workflow_dispatch:

permissions:
  contents: read

# never run two releases at the same time, and never cancel one halfway
concurrency:
  group: release
  cancel-in-progress: false

env:
  JAVA_VERSION: '21'
  MAVEN_ARGS: --batch-mode --no-transfer-progress --errors
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read
      security-events: write
      pull-requests: write
      actions: read

  semantic-release:
    name: Version & GitHub release
    needs: ci
    runs-on: ubuntu-latest
    # tag and release are created with the GitHub App token
    permissions:
      contents: read
    outputs:
      version: ${{ steps.release.outputs.version }}
    steps:
      # checkout, release tooling and bot identity come with the action; the repository's own
      # .releaserc.json (tag x.y.z, no CHANGELOG.md commit) is used instead of the action's default config
      - name: Run semantic-release
        id: release
        uses: dreitier/shared-ci-components/semantic-release@486b3fed3ce26e365ef8de6a17cde2ad86b4e269 # v1.3.0
        with:
          app-client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          app-private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

  jar:
    name: Jar
    needs: semantic-release
    if: needs.semantic-release.outputs.version != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      VERSION: ${{ needs.semantic-release.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.semantic-release.outputs.version }}
          persist-credentials: false

      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      # tested by the CI job above
      - name: Build jar
        run: |
          mvn package -DskipTests -Djacoco.skip=true -Drevision="${VERSION}"
          mkdir dist
          cp target/sunspec-exporter.jar "dist/sunspec-exporter-${VERSION}.jar"
          (cd dist && sha256sum ./*.jar > checksums.txt)

      - name: Attest build provenance of the jar
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*.jar

      - name: Attach jar to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$VERSION" dist/* -R "$GITHUB_REPOSITORY" --clobber

  image:
    name: Docker image
    needs: semantic-release
    if: needs.semantic-release.outputs.version != ''
    runs-on: ubuntu-latest
    permissions:
      # SBOM release asset
      contents: write
      packages: write
      id-token: write
      attestations: write
    env:
      VERSION: ${{ needs.semantic-release.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.semantic-release.outputs.version }}
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 1.2.3 -> 1.2.3, 1.2, 1, latest
      - name: Image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          flavor: |
            latest=false
          tags: |
            type=semver,pattern={{version}},value=${{ env.VERSION }}
            type=semver,pattern={{major}}.{{minor}},value=${{ env.VERSION }}
            type=semver,pattern={{major}},value=${{ env.VERSION }}
            type=raw,value=latest

      - name: Build and push
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha
          build-args: |
            VERSION=${{ env.VERSION }}

      # keyless Sigstore signature (GitHub OIDC identity of this workflow), verifiable with `cosign verify`;
      # the provenance comes from actions/attest-build-provenance below
      - name: Sign image
        uses: dreitier/shared-ci-components/cosign-sign@486b3fed3ce26e365ef8de6a17cde2ad86b4e269 # v1.3.0
        with:
          images: ${{ env.IMAGE }}
          digest: ${{ steps.build.outputs.digest }}

      - name: Attest image
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      # CycloneDX SBOM of the released image (Trivy, components only) as release asset
      - name: Generate SBOM
        id: sbom
        uses: dreitier/shared-ci-components/sbom@486b3fed3ce26e365ef8de6a17cde2ad86b4e269 # v1.3.0
        with:
          image: ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
          output: sunspec-exporter-${{ env.VERSION }}.cdx.json

      - name: Attach SBOM to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SBOM: ${{ steps.sbom.outputs.file }}
        run: gh release upload "$VERSION" "$SBOM" -R "$GITHUB_REPOSITORY" --clobber

  helm-chart:
    name: Helm chart PR
    needs: [semantic-release, image]
    if: needs.semantic-release.outputs.version != ''
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      # GITHUB_TOKEN can't reach other repositories; the app token is scoped to helm-charts only
      - name: Create GitHub App token
        id: app
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: helm-charts
          permission-contents: write

      - name: Notify helm-charts
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          VERSION: ${{ needs.semantic-release.outputs.version }}
        run: |
          gh api "repos/${GITHUB_REPOSITORY_OWNER}/helm-charts/dispatches" \
            -f event_type=sunspec-exporter-released \
            -f "client_payload[version]=${VERSION}"
