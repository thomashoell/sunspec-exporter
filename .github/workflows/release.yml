name: Release

# On every push to main (i.e. every merged PR):
# 1. run the full CI pipeline
# 2. semantic-release derives the next version from the Conventional Commits since the last tag,
#    pushes the tag and creates the GitHub release with the release notes.
#    Nothing happens if there are only non-releasing commits (docs, ci, chore, ...).
#    No commit is pushed to main, so the default GITHUB_TOKEN is sufficient even with branch protection.
# 3. the jar (+ SHA-256) is attached to the release
# 4. the multi-arch image is pushed to GHCR and signed
# Jar and image get build provenance attestations (verify with `gh attestation verify`).
on:
  push:
    branches:
      - main
  # re-run a release attempt manually, e.g. after a failed publish
  workflow_dispatch:

permissions:
  contents: read

# never run two releases at the same time, and never cancel one halfway
concurrency:
  group: release
  cancel-in-progress: false

env:
  JAVA_VERSION: '21'
  MAVEN_ARGS: --batch-mode --no-transfer-progress --errors
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read
      security-events: write
      pull-requests: write
      actions: read

  semantic-release:
    name: Version & GitHub release
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      # push the tag, create the release
      contents: write
    outputs:
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          # semantic-release authenticates git pushes with GITHUB_TOKEN itself
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - name: Install semantic-release
        run: npm ci --ignore-scripts

      - name: Run semantic-release
        id: release
        run: npx semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  jar:
    name: Jar
    needs: semantic-release
    if: needs.semantic-release.outputs.version != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      VERSION: ${{ needs.semantic-release.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.semantic-release.outputs.version }}
          persist-credentials: false

      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      # tested by the CI job above
      - name: Build jar
        run: |
          mvn package -DskipTests -Djacoco.skip=true -Drevision="${VERSION}"
          mkdir dist
          cp target/sunspec-exporter.jar "dist/sunspec-exporter-${VERSION}.jar"
          (cd dist && sha256sum ./*.jar > checksums.txt)

      - name: Attest build provenance of the jar
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*.jar

      - name: Attach jar to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$VERSION" dist/* -R "$GITHUB_REPOSITORY" --clobber

  image:
    name: Docker image
    needs: semantic-release
    if: needs.semantic-release.outputs.version != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    env:
      VERSION: ${{ needs.semantic-release.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.semantic-release.outputs.version }}
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 1.2.3 -> 1.2.3, 1.2, 1, latest
      - name: Image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          flavor: |
            latest=false
          tags: |
            type=semver,pattern={{version}},value=${{ env.VERSION }}
            type=semver,pattern={{major}}.{{minor}},value=${{ env.VERSION }}
            type=semver,pattern={{major}},value=${{ env.VERSION }}
            type=raw,value=latest

      - name: Build and push
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha
          build-args: |
            VERSION=${{ env.VERSION }}

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3

      # keyless Sigstore signature (GitHub OIDC identity of this workflow), verifiable with `cosign verify`
      - name: Sign image
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"

      - name: Attest image
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
