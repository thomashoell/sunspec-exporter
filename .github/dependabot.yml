# Dependency updates. "daily" runs Monday to Friday.
# Commit prefixes decide whether semantic-release publishes a new version when the PR is merged:
#   build(deps): ...  -> patch release (code and image that users run)
#   ci(deps): ...     -> no release (pipeline and release tooling)
version: 2

updates:
  - package-ecosystem: maven
    directory: /
    schedule:
      interval: daily
      time: "06:00"
      timezone: Europe/Berlin
    commit-message:
      prefix: build
      include: scope
    groups:
      # Spring Boot (parent POM) and the libraries it manages are released together
      spring-boot:
        patterns:
          - org.springframework.boot:*

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: daily
      time: "06:00"
      timezone: Europe/Berlin
    commit-message:
      prefix: build
      include: scope
    groups:
      # builder and runtime image share the Java version
      images:
        patterns:
          - "*"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: daily
      time: "06:00"
      timezone: Europe/Berlin
    commit-message:
      prefix: ci
      include: scope
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: daily
      time: "06:00"
      timezone: Europe/Berlin
    commit-message:
      prefix: ci
      include: scope
    groups:
      semantic-release:
        patterns:
          - "*"

  # hook versions in .pre-commit-config.yaml; the CI lint job uses the same actionlint version
  - package-ecosystem: pre-commit
    directory: /
    schedule:
      interval: daily
      time: "06:00"
      timezone: Europe/Berlin
    commit-message:
      prefix: ci
      include: scope
    groups:
      pre-commit:
        patterns:
          - "*"
